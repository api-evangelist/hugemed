aid: hugemed
name: HugeMed
description: HugeMed (Shenzhen HugeMed Medical Technical Development Co., Ltd.) is a
  high-tech medical-device manufacturer founded in 2014 and headquartered in Shenzhen,
  China, specializing in airway management and endoscopic visualization equipment.
  Its product portfolio spans video laryngoscopes (blade, flexible, and stylet types
  for emergency, anesthesia, ICU, and educational use), single-use endoscopes for
  gynecology, ENT, gastroenterology, pulmonology, and urology, reusable ENT and urology
  endoscopes, and medical image processors. The company operates production facilities
  exceeding 60,000 square meters, employs roughly 600 people, and serves more than
  10,000 medical institutions across 100+ countries. HugeMed is a hardware-first medical-device
  maker and does not currently publish a public API, developer portal, SDK, or technical
  integration surface; this profile was surfaced as a portfolio company of Qiming Venture
  Partners and enriched with company identity and infrastructure probes.
